{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartDine Kitchen{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Bootstrap and Bootstrap Icons for compatibility -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'restaurant/css/smartdine.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="sd-kitchen-body">

    <!-- Kitchen Application Shell Header -->
    <header class="sd-kitchen-header">
        <div class="sd-kitchen-header-inner">
            <!-- Left Branding -->
            <div class="sd-kitchen-brand">
                <i class="bi bi-fire sd-kitchen-brand-icon"></i>
                <span class="sd-kitchen-brand-name">SmartDine <span class="sd-kitchen-brand-badge">OPERATIONS</span></span>
            </div>

            <!-- Center Navigation -->
            <nav class="sd-kitchen-nav">
                <a href="{% url 'restaurant:kitchen_dashboard' %}" class="sd-kitchen-nav-link">
                    Kitchen Console
                </a>
            </nav>

            <!-- Right Actions -->
            <div class="sd-kitchen-actions">
                <span class="sd-kitchen-status">
                    <span class="sd-status-dot"></span> Operational
                </span>
                <span class="sd-kitchen-user">{{ request.user.username }}</span>
                <form method="POST" action="{% url 'restaurant:kitchen_logout' %}" style="margin:0;">
                    {% csrf_token %}
                    <button type="submit" class="sd-btn-kitchen-outline">
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="sd-kitchen-main">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
