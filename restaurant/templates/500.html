<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - 500</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Outfit Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8f9fa;
            color: #212529;
        }
        .error-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .btn-accent {
            background-color: #ff5722;
            color: #ffffff;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .btn-accent:hover {
            background-color: #e64a19;
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">
    <div class="error-card">
        <div class="text-danger mb-4">
            <i class="bi bi-exclamation-triangle display-1"></i>
        </div>
        <h1 class="fw-bold mb-2">500 - Server Error</h1>
        <p class="text-muted mb-4">An unexpected error occurred on the server. Please try again later.</p>
        <a href="/" class="btn btn-accent rounded-pill px-4 py-2 fw-bold text-uppercase">
            <i class="bi bi-house-door me-2"></i>Return to Menu
        </a>
    </div>
</body>
</html>
