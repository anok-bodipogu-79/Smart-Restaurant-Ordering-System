name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: restaurant_db
          POSTGRES_USER: restaurant_user
          POSTGRES_PASSWORD: restaurant_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Migrations State
      env:
        DEBUG: "True"
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run Django System Check
      env:
        DEBUG: "True"
      run: |
        python manage.py check

    - name: Run Production Deploy Checks
      env:
        DEBUG: "False"
        SECRET_KEY: "production-safe-ci-test-key-must-be-long-enough-for-validation-checks"
      run: |
        python manage.py check --deploy

    - name: Run Test Suite against PostgreSQL
      env:
        DATABASE_URL: postgres://restaurant_user:restaurant_pass@localhost:5432/restaurant_db
        DB_SSL_REQUIRE: "False"
        DEBUG: "True"
      run: |
        python manage.py test

    - name: Verify Static Files Collection
      env:
        DEBUG: "False"
        SECRET_KEY: "production-safe-ci-test-key-must-be-long-enough-for-validation-checks"
      run: |
        python manage.py collectstatic --no-input
